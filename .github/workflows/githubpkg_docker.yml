name: Maven employee docker build and push

on:
  push:
    branches: [ "github_packages" ]
  pull_request:
    branches: [ "github_packages" ]
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    # Step 3: Check if pom.xml exists
    - name: Check if pom.xml exists
      run: ls -l # Verify pom.xml exists

    # Step 4: Build with Maven
    - name: Build with Maven
      run: mvn clean package -B -f pom.xml

    - name: Debug GitHub Actor
      run: |
        echo "Running as user:"
        echo "${{ github.actor }}"
    
   # Step 5: Login to GitHub Container Registry
    - name: 'Login to GitHub Container Registry'
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{ secrets.Github_token }}

    # Step 6: Build and push Docker image
    
    - name: 'Build Inventory Image and push to github packages'
      run: |
          docker build -t  empsvc .
          docker tag empsvc ghcr.io/nikitaks/empsvc:latest
          docker push ghcr.io/nikitaks/empsvc:latest
    



