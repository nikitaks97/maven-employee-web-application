name: Deploy springboot application in kubernetes

on:
  push:
    branches: [ "kubernetes" ]
  pull_request:
    branches: [ "kubernetes" ]
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    # Step 3: Check if pom.xml exists
    - name: Check if pom.xml exists
      run: ls -l # Verify pom.xml exists

    # Step 4: Build with Maven
    - name: Build with Maven
      run: mvn clean package -B -f pom.xml

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Pull Docker image
      run: |
        docker pull nikitaks997797/javaapp:latest
        # Example: docker pull nginx:latest
        docker pull nginx:latest
    
    - name: Verify Docker Image
      run: |
        docker images  # List images to verify if the image is pulled

    # Deploy to K3s Cluster
    - name: Set up Kubeconfig
      run: |
        echo "${{ secrets.K3S_KUBECONFIG }}" > $HOME/.kube/config
        kubectl get nodes  # Verify that K3s is working

    - name: Apply Kubernetes Deployment
      run: |
        kubectl apply -f ./springboot-deployment.yaml  # Path to your Kubernetes deployment YAML

    - name: Expose Spring Boot app (Optional)
      run: |
        kubectl apply -f ./springboot-nodeprtsvc.yaml 
    
    



