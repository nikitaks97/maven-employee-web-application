name: Deploy springboot application in kubernetes

on:
  push:
    branches: [ "kubernetes" ]
  pull_request:
    branches: [ "kubernetes" ]
  workflow_dispatch: # Allows you to run this workflow manually
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

   # # Step 3: Check if pom.xml exists
   # - name: Check if pom.xml exists
   #   run: ls -l # Verify pom.xml exists
#
   # # Step 4: Build with Maven
   # - name: Build with Maven
   #   run: mvn clean package -B -f pom.xml
#
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Pull Docker image
      run: |
        docker pull nikitaks997797/javaapp:latest
        # Example: docker pull nginx:latest
        docker pull nginx:latest
    
    - name: Verify Docker Image
      run: |
        docker images  # List images to verify if the image is pulled

    # Deploy to K3s Cluster
    - name: Set up Kubeconfig
      run: |
        mkdir -p $HOME/.kube  # Ensure the .kube directory exists
        echo "${{ secrets.K3S_KUBECONFIG }}" > $HOME/.kube/config
        echo whoami
        echo "getting nodes"
        kubectl get nodes --insecure-skip-tls-verify=true  # Verify that K3s is working
      env:
          JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.14-7/x64
          JAVA_HOME_17_X64: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.14-7/x6

    - name: Apply Kubernetes Deployment
      run: |
        kubectl apply -f ./springboot-deployment.yaml --insecure-skip-tls-verify=true # Path to your Kubernetes deployment YAML file

    - name: Expose Spring Boot app (Optional)
      run: |
        kubectl apply -f ./springboot-nodeprtsvc.yaml --insecure-skip-tls-verify=true # Path to your Kubernetes service yaml file
        kubectl get all --insecure-skip-tls-verify=true
    
    



