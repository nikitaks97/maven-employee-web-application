name: Maven employee docker build and push

on:
  push:
    branches: [ "github_packages" ]
  pull_request:
    branches: [ "github_packages" ]
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    # Step 3: Check if pom.xml exists
    - name: Check if pom.xml exists
      run: ls -l # Verify pom.xml exists

    # Step 4: Build with Maven
    - name: Build with Maven
      run: mvn clean package -B -f pom.xml

    # Step 5: Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Step 6: Build and tag docker image 
    - name: Build and tag docker image 
      run: |
        docker build -t employee-service .
        docker tag employee-service nikitaks997797/employee-service:latest

    # Step 7: Push docker image to docker hub
    - name: Push docker image to docker hub
      run: docker push nikitaks997797/employee-service:latest
    - name: 'Login to GitHub Container Registry'
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{secrets.TOKEN}}
        password: ${{secrets.GITHUB_TOKEN}}
    



