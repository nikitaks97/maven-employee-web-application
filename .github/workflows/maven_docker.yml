# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Maven employee docker build and push

on:
  push:
    branches: [ "docker_github" ]
  pull_request:
    branches: [ "docker_github" ]
    
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Maven
      run: mvn clean package -B -f pom.xml
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and tag docker image 
      run: |
           docker build -t employee-service .
           docker tag employee-service nikitaks997797/employee-service:latest
    - name: Push docker image to docker hub
      run: docker push nikitaks997797/employee-service:latest
    

    
   